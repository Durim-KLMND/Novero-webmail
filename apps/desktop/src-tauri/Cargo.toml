[package]
name = "desktop"
description = "Windows desktop shell for Novero Mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
mail-auth = { path = "../../../crates/mail-auth" }
mail-core.workspace = true
mail-mime = { path = "../../../crates/mail-mime" }
mail-store = { path = "../../../crates/mail-store" }
mail-sync = { path = "../../../crates/mail-sync" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { workspace = true, features = ["time", "sync", "macros"] }

[lints]
workspace = true
