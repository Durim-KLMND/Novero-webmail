[package]
name = "desktop"
description = "Windows desktop shell for Novero Mail."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
mail-auth = { path = "../../../crates/mail-auth" }
mail-calendar = { path = "../../../crates/mail-calendar" }
mail-calendar-sync = { path = "../../../crates/mail-calendar-sync" }
mail-core.workspace = true
mail-mime = { path = "../../../crates/mail-mime" }
mail-send = { path = "../../../crates/mail-send" }
mail-store = { path = "../../../crates/mail-store" }
mail-sync = { path = "../../../crates/mail-sync" }
base64 = "0.22"
jiff = "0.2"
mime_guess = "2"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# Without `zip`: releases ship the plain installer, and that code has open advisories.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { workspace = true, features = ["time", "sync", "macros"] }

[lints]
workspace = true
