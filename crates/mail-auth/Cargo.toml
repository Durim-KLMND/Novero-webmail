[package]
name = "mail-auth"
description = "OAuth2, credential storage and server autodiscovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mail-core.workspace = true
base64 = "0.22"
getrandom = "0.3"
hickory-resolver = "0.26"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form", "json"] }
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { workspace = true, features = ["net", "io-util"] }
url = "2"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = "1"

[dev-dependencies]
mail-sync = { path = "../mail-sync" }
tokio = { workspace = true, features = ["net", "io-util"] }

[lints]
workspace = true
