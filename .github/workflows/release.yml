name: Release

# Pushing a tag such as v0.2.0 or v0.2.0-beta.3 builds the Windows installer,
# signs it, and publishes it as the latest release with its update manifest.
# auto-release.yml also calls it when a merge to main changes the version.
# One-time setup and the steps for a release are in docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The version tag to release, such as v0.2.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # Code signing with Azure Trusted Signing, once it is set up.
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check the tag matches the app version
        run: node scripts/check-version.mjs "$TAG"
      - name: Check the update key is set up
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.NOVERO_UPDATER_PUBKEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUBKEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret and the NOVERO_UPDATER_PUBKEY variable (docs/releasing.md)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Install the signing tool
        if: env.SIGN == 'true'
        run: cargo install trusted-signing-cli --locked
      - name: Build the installer
        working-directory: apps/desktop
        env:
          NOVERO_GOOGLE_CLIENT_ID: ${{ secrets.NOVERO_GOOGLE_CLIENT_ID }}
          NOVERO_GOOGLE_CLIENT_SECRET: ${{ secrets.NOVERO_GOOGLE_CLIENT_SECRET }}
          NOVERO_MICROSOFT_CLIENT_ID: ${{ secrets.NOVERO_MICROSOFT_CLIENT_ID }}
          NOVERO_UPDATER_PUBKEY: ${{ vars.NOVERO_UPDATER_PUBKEY }}
          # Selling Pro (docs/plans.md). Without these, every feature is unlocked.
          NOVERO_PLANS_STORE_ID: ${{ vars.NOVERO_PLANS_STORE_ID }}
          NOVERO_PLANS_PRODUCT_ID: ${{ vars.NOVERO_PLANS_PRODUCT_ID }}
          NOVERO_PLANS_CHECKOUT_URL: ${{ vars.NOVERO_PLANS_CHECKOUT_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          config=$(node -e '
            // The CLI checks each signature against this key after signing, so
            // a key pair that does not match fails the release, not the update.
            const config = {
              bundle: { createUpdaterArtifacts: true },
              plugins: { updater: { pubkey: process.env.NOVERO_UPDATER_PUBKEY.trim() } },
            };
            if (process.env.SIGN === "true") {
              const e = process.env;
              config.bundle.windows = {
                signCommand: `trusted-signing-cli -e ${e.AZURE_SIGNING_ENDPOINT} -a ${e.AZURE_SIGNING_ACCOUNT} -c ${e.AZURE_SIGNING_PROFILE} -d NoveroMail %1`,
              };
            }
            console.log(JSON.stringify(config));
          ')
          [ "$SIGN" = true ] || echo "::warning::The installer is not code signed; Windows SmartScreen will warn about it."
          npx tauri build --ci --config "$config"
      - name: Publish the release
        run: |
          version="${TAG#v}"
          cd target/release/bundle/nsis
          # GitHub turns spaces in asset names into dots, which would break the links.
          name="Novero-Mail_${version}_x64-setup.exe"
          mv ./*-setup.exe "$name"
          mv ./*-setup.exe.sig "$name.sig"
          # A release published on GitHub's Releases page keeps its title and notes.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$name" "$name.sig" --clobber --repo "$GITHUB_REPOSITORY"
            # Installed copies only look at the latest release, which can't be a pre-release.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" "$name" "$name.sig" --repo "$GITHUB_REPOSITORY" \
              --title "Novero Mail $version" --generate-notes --latest
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          node "$GITHUB_WORKSPACE/scripts/update-manifest.mjs" "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$name" "$name.sig" notes.md
          # Installed copies read this from the latest release.
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
