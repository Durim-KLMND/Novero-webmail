name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Pull requests that touch no Rust (only the UI or the docs, say) skip the Rust,
  # integration and Windows jobs. Pushes to main always run everything, which also
  # keeps the caches that pull requests restore up to date.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/desktop/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'deny.toml'
              - 'testing/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Check the app version agrees everywhere
        working-directory: .
        run: node scripts/check-version.mjs
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, tests)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The desktop crate embeds the built frontend at compile time.
      - name: Build frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  integration:
    name: Integration (IMAP test server)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start test mail servers
        run: docker compose -f testing/docker-compose.yml up -d --build --wait
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p mail-sync --locked -- --ignored
      - run: cargo test -p mail-send --locked -- --ignored
      - run: cargo test -p mail-auth --locked -- --ignored
      - name: Search and conversation list speed (100,000 messages)
        run: cargo test -p mail-store --release --locked -- --ignored --nocapture
      - name: Server logs on failure
        if: failure()
        run: docker compose -f testing/docker-compose.yml logs

  deny:
    name: Dependencies (licenses, advisories, sources)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Releases build the real installer (release.yml), so CI builds one only when the
  # workflow is run by hand (Actions → CI → Run workflow), to try out a branch.
  windows:
    name: Windows (build and tests)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - run: cargo test --workspace --locked
      - name: Build the installer (unsigned)
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/desktop
        run: npx tauri build --ci
        # Google and Microsoft sign-in, when the repository has these secrets
        # (see docs/oauth-apps.md). Without them the installer offers passwords only.
        env:
          NOVERO_GOOGLE_CLIENT_ID: ${{ secrets.NOVERO_GOOGLE_CLIENT_ID }}
          NOVERO_GOOGLE_CLIENT_SECRET: ${{ secrets.NOVERO_GOOGLE_CLIENT_SECRET }}
          NOVERO_MICROSOFT_CLIENT_ID: ${{ secrets.NOVERO_MICROSOFT_CLIENT_ID }}
          # Lets these test builds update from the releases (docs/releasing.md).
          NOVERO_UPDATER_PUBKEY: ${{ vars.NOVERO_UPDATER_PUBKEY }}
          # Selling Pro (docs/plans.md). Without these, every feature is unlocked.
          NOVERO_PLANS_STORE_ID: ${{ vars.NOVERO_PLANS_STORE_ID }}
          NOVERO_PLANS_PRODUCT_ID: ${{ vars.NOVERO_PLANS_PRODUCT_ID }}
          NOVERO_PLANS_CHECKOUT_URL: ${{ vars.NOVERO_PLANS_CHECKOUT_URL }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-installers
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
