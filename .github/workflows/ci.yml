name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  frontend:
    name: Frontend (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      # The desktop crate embeds the built frontend at compile time.
      - name: Build frontend
        working-directory: apps/desktop
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked

  integration:
    name: Integration (IMAP test server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start test mail servers
        run: docker compose -f testing/docker-compose.yml up -d --build --wait
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p mail-sync --locked -- --ignored
      - run: cargo test -p mail-send --locked -- --ignored
      - run: cargo test -p mail-auth --locked -- --ignored
      - name: Search and conversation list speed (100,000 messages)
        run: cargo test -p mail-store --release --locked -- --ignored --nocapture
      - name: Server logs on failure
        if: failure()
        run: docker compose -f testing/docker-compose.yml logs

  deny:
    name: Dependencies (licenses, advisories, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  windows:
    name: Windows (tests and installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - run: cargo test --workspace --locked
      # The release build takes most of this job, so pull requests skip it;
      # pushes to main still build and upload the installers.
      - name: Build MSI and NSIS installers (unsigned)
        if: github.event_name != 'pull_request'
        working-directory: apps/desktop
        run: npx tauri build --ci
        # Google and Microsoft sign-in, when the repository has these secrets
        # (see docs/oauth-apps.md). Without them the installer offers passwords only.
        env:
          NOVERO_GOOGLE_CLIENT_ID: ${{ secrets.NOVERO_GOOGLE_CLIENT_ID }}
          NOVERO_GOOGLE_CLIENT_SECRET: ${{ secrets.NOVERO_GOOGLE_CLIENT_SECRET }}
          NOVERO_MICROSOFT_CLIENT_ID: ${{ secrets.NOVERO_MICROSOFT_CLIENT_ID }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
