# Local mail servers for integration tests (Dovecot IMAP with a fake OAuth2
# provider on 18080, Mailpit SMTP):
#   docker compose -f testing/docker-compose.yml up -d --build --wait
services:
  imap:
    build: ./imap-server
    ports:
      - "1143:143"
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "doveadm mailbox list -u alice | grep -q INBOX"]
      interval: 2s
      timeout: 5s
      retries: 15
  smtp:
    # Mailpit: an SMTP server that keeps what it receives and shows it over
    # an HTTP API (http://127.0.0.1:8025/api/v1/messages).
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH: "alice:secret"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      # Anything outside example.test is refused, to test refused messages.
      MP_SMTP_ALLOWED_RECIPIENTS: "@example\\.test$"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 15
