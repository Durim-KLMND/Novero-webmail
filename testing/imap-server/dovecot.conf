# Test-only configuration: plaintext login is allowed on port 143.
protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login xoauth2 oauthbearer
log_path = /dev/stderr

mail_location = maildir:/srv/mail/%n/Maildir
mail_uid = vmail
mail_gid = vmail
first_valid_uid = 5000

passdb {
  driver = static
  args = password=secret
}
# OAuth2 access tokens, checked with the fake provider in oauth_mock.py.
passdb {
  driver = oauth2
  mechanisms = xoauth2 oauthbearer
  args = /etc/dovecot/dovecot-oauth2.conf.ext
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/srv/mail/%n
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

protocol imap {
  mail_plugins =
}
